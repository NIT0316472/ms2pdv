services:
  mysql:
    image: mysql:8.4
    container_name: singularidade-pdv-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: singularidade_pdv
      MYSQL_USER: singularidade
      MYSQL_PASSWORD: singularidade_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3307:3306"
    volumes:
      - singularidade_mysql_data:/var/lib/mysql

volumes:
  singularidade_mysql_data:
